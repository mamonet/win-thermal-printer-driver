# repo: gateway/Cargo.toml
[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
rustls = "0.21"
tokio-rustls = "0.24"
rustls-pemfile = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.15"
sha2 = "0.10"
thiserror = "1"
